.fig{position:relative;display:inline-block;max-width:100%}

<script>

const LESSON = {
  topic: 'Scaling a web service',
  goal: 'Know the two ways to give a service more capacity, and when to pick each.',
  summary: 'When a service gets more traffic than one machine can handle, you either make that machine **bigger** (scale up) or add **more** machines that share the work (scale out). Scaling up is simple but has a ceiling and one point of failure. Scaling out has no hard ceiling and survives a dead server, but needs a load balancer and servers that keep no customer state.',
  runningExample: 'A shop website that handles 200 orders a minute today and expects 2,000 on Black Friday.',
  principle: 'Scale up while it is cheap and simple; design to scale out before you hit the ceiling.',
  source: {
    title: 'Two sample sketchnotes on vertical vs horizontal scaling',
    read: ['Sketchnote A (whole image)', 'Sketchnote B (whole image)'],

  map: {

      {id:'up', label:'Scale up (bigger server)', x:270, y:20},

      {id:'lb', label:'Load balancer', x:540, y:220},
      {id:'choice', label:'When to use which', x:540, y:20}

    edges: [
      {from:'traffic', to:'up', label:'option 1', kind:'flow'},
      {from:'traffic', to:'out', label:'option 2', kind:'flow'},
      {from:'out', to:'lb', label:'needs', kind:'depends'},
      {from:'up', to:'choice', label:'trade-offs feed', kind:'causes'},
      {from:'out', to:'choice', label:'trade-offs feed', kind:'causes'}

  terms: [
    {term:'Vertical scaling (scale up)', meaning:'Give one server more CPU, memory or disk.', step:'s2'},
    {term:'Horizontal scaling (scale out)', meaning:'Add more servers that share the work.', step:'s3'},
    {term:'Load balancer', meaning:'The front door that spreads requests across servers.', step:'s3'},
    {term:'Single point of failure', meaning:'One part whose failure takes everything down.', step:'s2'},
    {term:'Stateless server', meaning:'A server that keeps no customer data between requests, so any server can serve any request.', step:'s4'}
  ],
  steps: [
    {
      id:'s1', title:'The problem', concepts:['traffic'],
      why:'Every option later is an answer to this one problem.',
      idea:'One server can only handle so many requests a second. Past that point, pages slow down and then requests fail.\n\nThe shop handles 200 orders a minute today. Black Friday brings 2,000. The question is **where the extra capacity comes from**.',
      picture:{type:'cards', items:[
        {icon:'🛒', title:'Today', text:'200 orders / min', caption:'one server copes'},
        {icon:'🔥', title:'Black Friday', text:'2,000 orders / min', caption:'one server can\'t'},
        {icon:'❓', title:'The question', text:'Where does the extra capacity come from?', caption:'two answers'}

      pictureNote:'Same shop, ten times the load. The rest of the lesson answers the last card.',
      simpler:'One cashier, a queue out the door. You either get a faster cashier or open more tills.',
      example:'At 2,000 orders a minute the single server hits 100% CPU, checkout takes 20 seconds, and some customers see errors.',

      deeper:'Capacity is limited by whichever resource runs out first: CPU, memory, disk speed, network or database connections. Measure which one before choosing a fix.',

      takeaway:'More traffic than one server can take means you need more capacity from somewhere.',

    {

  'fill','fill-opacity','fill-rule','stroke','stroke-width','stroke-opacity','stroke-dasharray','stroke-linecap','stroke-linejoin','opacity','paint-order',

function wrapText(label, max){
  const words = String(label).split(/\s+/); const lines = []; let cur = '';
  for (const w of words){ if ((cur + ' ' + w).trim().length > max && cur){lines.push(cur); cur = w} else cur = (cur + ' ' + w).trim() }

}
function arrowDefs(id){

  <marker id="${id}o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--muted)" stroke-width="1.6"/></marker>
  <marker id="${id}a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs>`;
}
const EDGE_LEGEND = {flow:'leads to / calls', async:'event / message (async)', depends:'depends on', causes:'causes / feeds'};

let uid = 0;
function renderMap(map, focusIds = [], doneIds = new Set(), interactive = true){
  const id = 'm' + (uid++), W = 180, H = 62;
  map.nodes.forEach(n => { n.x = +n.x || 0; n.y = +n.y || 0; n.w = +n.w || W });
  const maxX = Math.max(...map.nodes.map(n => n.x + (n.w || W))) + 20, maxY = Math.max(...map.nodes.map(n => n.y + H)) + 40;
  let s = `<svg viewBox="0 0 ${maxX} ${maxY}" style="max-width:${Math.round(maxX * 1.05)}px" role="img" aria-label="Concept map">${arrowDefs(id)}`;
  const kinds = new Set(); let labels = '';

    const a = nodeById[e.from] || map.nodes.find(n => n.id === e.from), b = nodeById[e.to] || map.nodes.find(n => n.id === e.to);
    if (!a || !b) continue;
    const kind = pick(e.kind, Object.keys(EDGE_LEGEND)) || 'flow'; kinds.add(kind);
    const aw = a.w || W, bw = b.w || W;
    const ax = a.x + aw/2, ay = a.y + H/2, bx = b.x + bw/2, by = b.y + H/2, dx = bx - ax, dy = by - ay;
    const clip = (w, sign) => { const t = Math.min((w/2 + 6) / Math.abs(dx || 1e-9), (H/2 + 6) / Math.abs(dy || 1e-9)); return t };
    const ta = clip(aw), tb = clip(bw);
    const x1 = ax + dx*ta, y1 = ay + dy*ta, x2 = bx - dx*tb, y2 = by - dy*tb;
    const mk = kind === 'depends' ? `${id}o` : id;
    s += `<g class="edge"><path class="eline ${kind}" d="M${x1} ${y1}L${x2} ${y2}" marker-end="url(#${mk})"/>`;
    if (e.label){

      const len = Math.hypot(x2 - x1, y2 - y1) || 1; let nx = -(y2 - y1) / len, ny = (x2 - x1) / len; if (ny > 0){ nx = -nx; ny = -ny }
      const lx = (x1 + x2)/2 + nx * 14, ly = (y1 + y2)/2 + ny * 14 + 4;
      const anchor = Math.abs(nx) > 0.5 ? (nx < 0 ? 'end' : 'start') : 'middle';
      labels += `<text class="elabel" x="${lx}" y="${ly}" text-anchor="${anchor}">${esc(e.label)}</text>`;
    }
    s += '</g>';
  }

    const lines = wrapText(n.label, Math.floor(w / 9.5));

    const tab = interactive && target >= 0 ? ` tabindex="0" role="button" data-go="${target}" aria-label="Go to ${esc(n.label)}"` : '';
    s += `<g class="node${focus?' focus':''}${done?' done':''}${nr?' notread':''}"${tab}><rect class="nbox" x="${n.x}" y="${n.y}" width="${w}" height="${H}" rx="12"/>`;
    lines.forEach((l, i) => { s += `<text class="ntext" x="${n.x + w/2}" y="${n.y + H/2 + 5 + (i - (lines.length-1)/2) * 17}" text-anchor="middle">${i === 0 && done ? '✓ ' : ''}${esc(l)}</text>` });
    if (nr) s += `<text class="elabel" x="${n.x + w/2}" y="${n.y + H + 16}" text-anchor="middle">(${esc(UI.notRead.toLowerCase())})</text>`;
    if (focus) s += `<text class="here" x="${n.x + w/2}" y="${n.y + H + 18}" text-anchor="middle">◀ ${esc(UI.here.toLowerCase())}</text>`;

// ---------- orientation / route ----------
function doneConcepts(upto){return new Set(LESSON.steps.slice(0, Math.max(upto, 0)).filter(s => S.viewed.has(s.id)).flatMap(s => s.concepts || []))}
function renderOrient(){
  const i = S.current, st = LESSON.steps[i];
  $('#orient').innerHTML = `<div><b>${esc(UI.learning)}:</b> ${esc(LESSON.topic)}</div><div><b>${esc(UI.here)}:</b> ${i < 0 ? esc(UI.overview) : esc(st.title) + ' — ' + esc(UI.stepOf.replace('{n}', i + 1).replace('{t}', LESSON.steps.length))}</div><div><b>${esc(UI.matters)}:</b> ${i < 0 ? inline(LESSON.goal) : inline(st.why)}</div>`;
  $('#route').innerHTML = `<button data-go="-1"${i < 0 ? ' aria-current="step"' : ''}>${esc(UI.map)}</button>` + LESSON.steps.map((s, j) => `<button data-go="${j}" class="${S.viewed.has(s.id) && j !== i ? 'done' : ''}"${j === i ? ' aria-current="step"' : ''}>${j + 1}. ${esc(s.title)}</button>`).join('');
  const cur = $('#route [aria-current]'); if (cur) cur.scrollIntoView({block:'nearest', inline:'nearest'});
}
// ---------- views ----------
function viewMap(){
  const src = LESSON.source || {};
  return `<section class="card"><h2>${esc(LESSON.topic)}</h2>${md(LESSON.summary)}
    ${src.title ? `<p class="small muted"><b>${esc(UI.read)}:</b> ${esc((src.read || []).join(' · ') || src.title)}${(src.notRead || []).length ? `<br><b>${esc(UI.notRead)}:</b> ${esc(src.notRead.join(' · '))}` : ''}</p>` : ''}
    <div class="pic">${renderMap(LESSON.map, [], doneConcepts(LESSON.steps.length))}</div>
    <p class="picnote">Click a box to jump to the step that explains it.</p>
    <h3>${esc(UI.route)}</h3><ol>${LESSON.steps.map((s, j) => `<li><a href="#" data-go="${j}">${esc(s.title)}</a>${S.viewed.has(s.id) ? ' ✓' : ''} — <span class="muted">${inline(s.why)}</span></li>`).join('')}</ol>
    ${LESSON.runningExample ? `<p><b>${esc(UI.runningEx)}:</b> ${inline(LESSON.runningExample)}</p>` : ''}
    <div class="nav"><span></span><button class="primary" data-go="${LESSON.steps.findIndex(s => !S.viewed.has(s.id)) >= 0 ? LESSON.steps.findIndex(s => !S.viewed.has(s.id)) : 0}">${esc(UI.start)}</button></div></section>`;
}
function viewStep(i){
  const st = LESSON.steps[i], open = S.layer[st.id];
  const layers = [['simpler', UI.simpler], ['example', UI.example], ['whyLayer', UI.why], ['deeper', UI.deeper]].filter(([k]) => st[k]);
  const marks = (st.marks || []).map(m => `<div class="mark ${esc(m.kind)}"><b>${esc({source:'Source', inference:'My inference', open:'Open question', background:'Background'}[m.kind] || m.kind)}:</b> ${inline(m.text)}</div>`).join('');
  const next = LESSON.steps[i + 1];
  return `<section class="card"><h2>Step ${i + 1}: ${esc(st.title)}</h2>
    ${st.picture ? renderPicture(st.picture) + (st.pictureNote ? `<div class="picnote">${inline(st.pictureNote)}</div>` : '') : ''}
    ${md(st.idea)}
    ${marks}
    ${layers.length ? `<div class="layers" role="group" aria-label="Explain differently">${layers.map(([k, l]) => `<button data-layer="${k}" aria-pressed="${open === k}">${esc(l)}</button>`).join('')}</div>` : ''}
    ${open && st[open] ? `<div class="layer"><h4>${esc((layers.find(l => l[0] === open) || [])[1])}</h4>${md(st[open])}</div>` : ''}
    ${st.connection ? `<div class="connect"><b>${esc(UI.connects)}:</b> ${inline(st.connection)}</div>` : ''}
    ${st.check ? `<details class="check"><summary>${esc(UI.check)}: ${inline(st.check.q)}</summary><p>${inline(st.check.a)}</p></details>` : ''}
    ${(st.refs || []).length ? `<div class="chips">${st.refs.map(r => `<span class="chip">📄 ${esc(r)}</span>`).join('')}</div>` : ''}
    <div class="principle"><small>${esc(UI.takeaway)}</small>${inline(st.takeaway)}</div>
    <div class="nav">${i > 0 ? `<button data-go="${i - 1}">${esc(UI.prev)}</button>` : '<span></span>'}<button data-go="-1">${esc(UI.toMap)}</button>${next ? `<button class="primary" data-go="${i + 1}">${esc(UI.next)} ${esc(next.title)}</button>` : `<button class="primary" data-view="sheet">${esc(UI.recap)} ▶</button>`}</div></section>`;
}
function validate(){
  const w = [], ids = new Set();
  for (const s of LESSON.steps){ if (ids.has(s.id)) w.push(`Duplicate step id ${s.id}`); ids.add(s.id); if (!s.takeaway) w.push(`Step "${s.title}" has no takeaway`); for (const c of s.concepts || []) if (!nodeById[c]) w.push(`Step "${s.title}" points at unknown map node "${c}"`) }
  for (const n of LESSON.map.nodes) if (n.status !== 'notread' && !LESSON.steps.some(s => (s.concepts || []).includes(n.id))) w.push(`Map box "${n.label}" is not taught by any step`);
  for (const e of LESSON.map.edges) if (!nodeById[e.from] || !nodeById[e.to]) w.push(`Arrow ${e.from} → ${e.to} points at a missing box`);
  const lids = new Set();
  for (const l of LESSON.ledger || []){
    if (lids.has(l.id)) w.push(`Duplicate ledger id ${l.id}`); lids.add(l.id);
    if (l.step && !(l.step in stepIndex)) w.push(`${l.id} points at missing step "${l.step}"`);
    if (!l.step && !['skipped','unreadable'].includes(l.status)) w.push(`${l.id} "${l.item}" is not taught anywhere and not marked skipped/unreadable`);
    if (['skipped','unreadable'].includes(l.status) && !l.note) w.push(`${l.id} is ${l.status} without a reason`);
  }
  for (const t of LESSON.terms || []) if (t.step && !(t.step in stepIndex)) w.push(`Term "${t.term}" points at missing step "${t.step}"`);
  if (!(LESSON.ledger || []).length) w.push('No source ledger: coverage cannot be checked');
  return w;
}
let covFilter = 'all';
function viewCoverage(){
  const L = LESSON.ledger || [], warns = validate();
  const taught = L.filter(l => l.step), skipped = L.filter(l => l.status === 'skipped'), unread = L.filter(l => l.status === 'unreadable');
  const seen = taught.filter(l => S.viewed.has(l.step));
  const rows = L.filter(l => covFilter === 'all' || (covFilter === 'unseen' && l.step && !S.viewed.has(l.step)) || l.status === covFilter);
  return `<section class="card"><h2>Source coverage</h2>
    <p>Every distinct item found in the source, and where the lesson teaches it. Nothing is dropped silently: an item is either taught in a step, or marked skipped or unreadable with a reason.</p>
    ${warns.length ? `<div class="warn"><b>Gaps found (${warns.length}):</b><ul>${warns.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : `<div class="ok"><b>Complete:</b> all ${L.length} source items are accounted for.</div>`}
    <p><b>${taught.length}</b> taught · <b>${seen.length}</b> of those you've viewed · <b>${skipped.length}</b> skipped · <b>${unread.length}</b> unreadable</p>
    <div class="filters" role="group" aria-label="Filter">${[['all','All'],['unseen','Not viewed yet'],['skipped','Skipped'],['unreadable','Unreadable']].map(([k, l]) => `<button data-filter="${k}" aria-pressed="${covFilter === k}">${l}</button>`).join('')}</div>
    <div class="tablewrap"><table><thead><tr><th>#</th><th>Item</th><th>Kind</th><th>Source</th><th>Taught in</th><th>Status</th></tr></thead><tbody>
    ${rows.map(l => `<tr><td>${esc(l.id)}</td><td>${inline(l.item)}</td><td>${esc(l.kind || '')}</td><td>${esc(l.ref || '')}</td><td>${l.step && l.step in stepIndex ? `<a href="#" data-go="${stepIndex[l.step]}">Step ${stepIndex[l.step] + 1}: ${esc(LESSON.steps[stepIndex[l.step]].title)}</a>` : '—'}</td><td>${l.step ? (S.viewed.has(l.step) ? '✓ viewed' : 'to come') : esc(l.status || '?') + (l.note ? ': ' + esc(l.note) : '')}</td></tr>`).join('')}
    </tbody></table></div></section>`;
}
function viewSheet(){
  const r = LESSON.recap || {};
  return `<section class="card sheet"><h2>${esc(LESSON.topic)} — ${esc(UI.sheet.replace(/^\W+\s*/, ''))}</h2>${md(LESSON.summary)}
    <div class="pic">${renderMap(LESSON.map, [], new Set(), false)}</div>
    ${LESSON.steps.map((s, j) => `<div class="row"><b>${j + 1}. ${esc(s.title)}</b><span>${inline(s.takeaway)}</span></div>`).join('')}
    ${LESSON.runningExample ? `<p><b>${esc(UI.runningEx)}:</b> ${inline(LESSON.runningExample)}</p>` : ''}
    ${(r.connections || []).length ? `<h3>Connections</h3><ul>${r.connections.map(c => `<li>${inline(c)}</li>`).join('')}</ul>` : ''}
    ${r.misunderstanding ? `<h3>${esc(UI.misunderstanding)}</h3><p>✕ ${inline(r.misunderstanding.wrong)}<br>✓ ${inline(r.misunderstanding.right)}</p>` : ''}
    ${(LESSON.terms || []).length ? `<h3>${esc(UI.terms)}</h3><ul>${LESSON.terms.map(t => `<li><b>${esc(t.term)}</b> = ${inline(t.meaning)}</li>`).join('')}</ul>` : ''}
    ${(r.unexplored || []).length ? `<h3>${esc(UI.unexplored)}</h3><ul>${r.unexplored.map(c => `<li>${inline(c)}</li>`).join('')}</ul>` : ''}
    ${LESSON.principle ? `<div class="principle"><small>${esc(UI.principle)}</small>${inline(LESSON.principle)}</div>` : ''}
    <div class="nav"><button data-go="-1">${esc(UI.toMap)}</button><button onclick="print()">🖨 Print / PDF</button></div></section>`;
}
let view = 'map';
function render(){
  renderOrient();
  $('#view').innerHTML = view === 'coverage' ? viewCoverage() : view === 'sheet' ? viewSheet() : S.current < 0 ? viewMap() : viewStep(S.current);
  document.querySelectorAll('#tabs [data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === view || (b.dataset.view === 'map' && view === 'map' && S.current < 0))));
}
function go(i){
  i = Math.max(-1, Math.min(LESSON.steps.length - 1, i));
  S.current = i; view = i < 0 ? 'map' : 'step';
  $('#resume').hidden = true;
  if (i >= 0) S.viewed.add(LESSON.steps[i].id);
  persist(); render(); window.scrollTo({top:0, behavior:'smooth'});
}
// ---------- dialogs ----------
function openDialog(html){$('#dlgBody').innerHTML = html; $('#dlgClose').textContent = UI.close; $('#dlg').showModal()}
function lost(){
  const i = S.current, st = LESSON.steps[i], prev = LESSON.steps[i - 1];
  openDialog(`<h2 id="dlgT">${esc(UI.lostTitle)}</h2><ul>
    <li><b>${esc(UI.goal)}:</b> ${inline(LESSON.goal)}</li>
    <li><b>${esc(UI.last)}:</b> ${prev ? inline(prev.takeaway) : esc(UI.justStarting)}</li>
    <li><b>${esc(UI.link)}:</b> ${st ? inline(st.connection || st.why) : inline(LESSON.steps[0].why)}</li></ul>
    <div class="pic">${renderMap(LESSON.map, st ? st.concepts || [] : [], doneConcepts(i), false)}</div>
    <div class="nav"><button data-go="-1" data-close>${esc(UI.toMap)}</button><button class="primary" data-go="${Math.max(i, 0)}" data-close>${esc(UI.next)}</button></div>`);
}
function checkpoint(){
  const i = S.current, st = LESSON.steps[i];
  const covered = LESSON.steps.filter((s, j) => S.viewed.has(s.id) && j !== i).map(s => s.title);
  const coveredIds = new Set(LESSON.steps.filter((s, j) => S.viewed.has(s.id) && j !== i).map(s => s.id));
  const terms = (LESSON.terms || []).filter(t => !t.step || coveredIds.has(t.step)).map(t => `  - ${t.term} = ${t.meaning}`);
  const open = LESSON.steps.flatMap(s => (s.marks || []).filter(m => m.kind === 'open').map(m => m.text)).concat((LESSON.ledger || []).filter(l => l.status === 'unreadable').map(l => `${l.item} (unreadable${l.note ? ': ' + l.note : ''})`));
  const next = st ? (LESSON.steps[i + 1] ? LESSON.steps[i + 1].title : 'Recap') : LESSON.steps[0].title;
  return [`CHECKPOINT — ${LESSON.topic} — ${new Date().toISOString().slice(0, 10)}`,
    `Source: ${LESSON.source ? LESSON.source.title : '—'}${LESSON.source && (LESSON.source.notRead || []).length ? ' (not read: ' + LESSON.source.notRead.join('; ') + ')' : ''}`,
    `Map: ${LESSON.map.nodes.map(n => n.label).join(' · ')}`,
    `Covered: ${covered.join(', ') || 'nothing yet'}`,
    `We are here: ${st ? `Step ${i + 1}, ${st.title}` : 'the overview map'}`,
    `Running example: ${LESSON.runningExample || '—'}`,
    `Key terms:${terms.length ? '\n' + terms.join('\n') : ' none yet'}`,
    `Open questions: ${open.join(' · ') || 'none'}`,
    `Next step: ${next}`,
    'To resume: paste this into a chat with the connect-the-dots skill and say "continue".'].join('\n');
}
function resetProgress(){
  S.viewed.clear(); S.layer = {}; S.current = -1; view = 'map';
  try{ localStorage.removeItem(KEY) }catch(e){}
  $('#resume').hidden = true;
  if ($('#dlg').open) $('#dlg').close();
  render(); window.scrollTo({top:0, behavior:'smooth'});
}
function confirmReset(){
  openDialog(`<h2 id="dlgT">${esc(UI.resetTitle)}</h2><p>${esc(UI.resetText)}</p><div class="nav" style="justify-content:flex-end"><button id="noReset">${esc(UI.cancel)}</button><button class="primary" id="doReset">${esc(UI.resetConfirm)}</button></div>`);
  const footer = $('#dlg > .nav'); footer.hidden = true;
  $('#dlg').addEventListener('close', () => { footer.hidden = false }, {once:true});
  $('#noReset').onclick = () => $('#dlg').close();
  $('#doReset').onclick = resetProgress;
}
function save(){
  persist();
  const txt = checkpoint();
  openDialog(`<h2 id="dlgT">${esc(UI.save)}</h2><pre class="ck" id="ck">${esc(txt)}</pre><p class="small muted">${esc(UI.savedLocal)}</p><div class="nav"><span></span><button id="copyCk">${esc(UI.copy)}</button></div>`);
  $('#copyCk').onclick = async () => { try{ await navigator.clipboard.writeText(txt); $('#copyCk').textContent = UI.copied }catch(e){ const r = document.createRange(); r.selectNodeContents($('#ck')); getSelection().removeAllRanges(); getSelection().addRange(r) } };
}
// ---------- wiring ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-view],[data-layer],[data-filter],[data-pin]'); if (!t) return;
  if (t.tagName === 'A') e.preventDefault();
  if (t.hasAttribute('data-close')) $('#dlg').close();
  if (t.dataset.go !== undefined) return go(+t.dataset.go);
  if (t.dataset.view){ view = t.dataset.view === 'map' ? (S.current = -1, 'map') : t.dataset.view; return render() }
  if (t.dataset.layer){ const st = LESSON.steps[S.current]; S.layer[st.id] = S.layer[st.id] === t.dataset.layer ? null : t.dataset.layer; return render() }
  if (t.dataset.filter){ covFilter = t.dataset.filter; return render() }
  if (t.dataset.pin){ document.querySelectorAll('.pins li').forEach(li => li.classList.toggle('on', li.id === t.dataset.pin)); document.getElementById(t.dataset.pin).scrollIntoView({block:'nearest'}) }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea') || $('#dlg').open) return;
  const node = e.target.closest('[data-go]');
  if (node && node.tagName === 'g' && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); return go(+node.dataset.go) }
  if (e.key === 'ArrowRight' && view !== 'coverage') go(S.current + 1);
  if (e.key === 'ArrowLeft' && view !== 'coverage') go(S.current - 1);
  if (e.key === 'l') lost();
  if (e.key === 'm') go(-1);
});
$('#bLost').onclick = lost; $('#bSave').onclick = save; $('#bReset').onclick = confirmReset; $('#dlgClose').onclick = () => $('#dlg').close();
if ($('#bFont')) $('#bFont').onclick = () => { const r = document.documentElement; r.dataset.font = r.dataset.font === 'plain' ? 'hand' : 'plain'; persist() };
function init(){
  document.title = LESSON.topic; $('#title').textContent = LESSON.topic;
  document.documentElement.lang = LESSON.lang || 'en'; document.documentElement.dir = LESSON.dir || 'ltr';
  $('#bCov').textContent = UI.coverage; $('#bSheet').textContent = UI.sheet; $('#bLost').textContent = UI.lost; $('#bSave').textContent = UI.save; $('#bReset').textContent = UI.reset;
  const saved = load();
  if (saved){
    (saved.viewed || []).forEach(v => S.viewed.add(v));
    if (saved.font) document.documentElement.dataset.font = saved.font;
    const st = LESSON.steps[saved.current];
    if (st){ const b = $('#resume'); b.hidden = false; b.innerHTML = `<span>${esc(UI.resume)} <b>Step ${saved.current + 1}: ${esc(st.title)}</b></span><button class="primary" data-go="${saved.current}" id="rs">${esc(UI.resumeBtn)}</button><button id="rr">${esc(UI.restart)}</button>`;
      $('#rs').addEventListener('click', () => { b.hidden = true }); $('#rr').onclick = resetProgress }
  }
  const w = validate(); if (w.length) console.warn('Lesson gaps:', w);
  render();
}
init();
</script>
</body>
</html>
